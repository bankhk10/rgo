version: '3.8'

services:
  # Application Service (Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my_laravel_app # ตั้งชื่อ Container ตามต้องการ
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html                     # Mount โค้ดโปรเจกต์ (ยกเว้นส่วนที่จะใช้ named volume)
      - ./storage/logs:/var/www/html/storage/logs  # 💡 mount เฉพาะ logs folder
      - app_storage:/var/www/html/storage/app      # ส่วนอื่นยังใช้ volume ได้
      - /var/www/html/vendor                 # (Optional) ถ้า vendor ใหญ่มาก และไม่ต้องการให้ host mount ทับ
      - app_storage:/var/www/html/storage    # ใช้ Named Volume สำหรับ storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache # ใช้ Named Volume สำหรับ bootstrap/cache
    ports:
      - "8000:80" # Map port 8000 ของเครื่องคุณไปยัง port 80 ของ Container
    networks:
      - laravel_network

  # Database Service (เช่น MySQL)
  db:
    image: mysql:8.0 # เลือกเวอร์ชัน MySQL ที่ต้องการ
    container_name: my_laravel_db
    restart: unless-stopped
    tty: true
    ports:
      - "33061:3306" # Map port 33061 ของเครื่องคุณไปยัง port 3306 ของ Container (ระวัง port ชนกับ MySQL ที่ติดตั้งในเครื่อง)
    environment:
      MYSQL_DATABASE: your_database_name # ชื่อ Database
      MYSQL_USER: your_database_user # User สำหรับ Database
      MYSQL_PASSWORD: your_database_password # Password สำหรับ Database
      MYSQL_ROOT_PASSWORD: your_root_password # Password ของ Root User MySQL
    volumes:
      - dbdata:/var/lib/mysql # Persist Database Data
    networks:
      - laravel_network

# Networks
networks:
  laravel_network:
    driver: bridge

# Named Volumes
volumes:
  dbdata: # ถ้าคุณใช้สำหรับ database
    driver: local
  app_storage: # ประกาศ Named Volume สำหรับ storage
    driver: local
  app_bootstrap_cache: # ประกาศ Named Volume สำหรับ bootstrap/cache
    driver: local
