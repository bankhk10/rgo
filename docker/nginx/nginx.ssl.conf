user  nginx;
worker_processes auto;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ---------------- HTTP (80) ----------------
  server {
    listen 80;
    server_name rgo.intercrop.co.th;

    # ให้ Certbot ต่ออายุผ่าน webroot ได้
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type "text/plain";
      try_files $uri =404;
    }

    # ที่เหลือ redirect ไป https
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---------------- HTTPS (443) ----------------
  server {
    listen 443 ssl http2;
    server_name rgo.intercrop.co.th;

    # ใบรับรองจาก certbot (ที่เรา mount เข้ามา)
    ssl_certificate     /etc/letsencrypt/live/rgo.intercrop.co.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rgo.intercrop.co.th/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers พื้นฐาน
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # กันเหนียว: เผื่อ certbot มา path นี้ผ่าน https
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/acme;
      default_type "text/plain";
      try_files $uri =404;
    }

    root /var/www/html/public;
    index index.php index.html;

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_pass app:9000;  # ตรงกับ service name ของ PHP-FPM
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_param PATH_INFO $fastcgi_path_info;
      fastcgi_read_timeout 120s;
    }

    client_max_body_size 50m;
  }
}
