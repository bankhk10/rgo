version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # ถ้าต้องการ tag ภาพไว้ใช้งานซ้ำ ให้เพิ่ม:
      # args:
      #   - APP_ENV=production
    image: my-laravel-app:prod
    container_name: laravel_app_prod
    restart: unless-stopped
    env_file:
      - .env.prod      # เก็บค่า env ของ production (จะอธิบายด้านล่าง)
    working_dir: /var/www/html
    # ใช้ "shared code volume" เพื่อให้ Nginx เห็นโค้ดเดียวกัน
    volumes:
      - app_code:/var/www/html                # โค้ดถูก copy จาก /app-src -> volume นี้ โดย entrypoint.sh
      - app_logs:/var/www/html/storage/logs   # แยก logs ออกมาให้อ่านง่าย/ปลอดภัย
    expose:
      - "9000"          # php-fpm ภายในเครือข่าย
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    container_name: laravel_nginx_prod
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # ถ้ามี TLS/Certs (แนะนำทำ TLS ที่ ALB/CloudFront/Reverse Proxy)
    volumes:
      - app_code:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # ถ้ามี TLS:
      # - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - app_net

  # คิวเวิร์คเกอร์ (ถ้าใช้คิวเช่น SQS/Redis)
  queue:
    image: my-laravel-app:prod
    container_name: laravel_queue_prod
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env.prod
    working_dir: /var/www/html
    volumes:
      - app_code:/var/www/html
      - app_logs:/var/www/html/storage/logs
    command: >
      bash -lc "php artisan queue:work --sleep=3 --tries=3 --timeout=120"
    networks:
      - app_net

  # ตัวจัดตารางงาน (Scheduler)
  scheduler:
    image: my-laravel-app:prod
    container_name: laravel_scheduler_prod
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env.prod
    working_dir: /var/www/html
    volumes:
      - app_code:/var/www/html
      - app_logs:/var/www/html/storage/logs
    command: >
      bash -lc "php artisan schedule:work"
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  app_code:
  app_logs:
