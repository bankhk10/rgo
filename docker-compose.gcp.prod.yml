version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app_prod
    restart: unless-stopped
    tty: true
    working_dir: /var/www/html
    env_file:
      - .env.gcp.prod
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"  # ให้ container มองเห็น host VM (ที่มี Cloud SQL Proxy)
    networks:
      - app_net

  web:
    image: nginx:1.25
    container_name: nginx_prod
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - app_net

  certbot:
    image: certbot/certbot:latest
    container_name: certbot_prod
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  certbot-www:
  letsencrypt:
