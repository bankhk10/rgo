services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app_prod
    restart: unless-stopped
    tty: true
    working_dir: /var/www/html
    env_file:
      - .env.gcp.prod
    volumes:
      - app_code:/var/www/html             # ⬅️ โค้ด/สาธารณะ/ทุกอย่างอยู่ใน volume
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_net

  web:
    image: nginx:1.25
    container_name: nginx_prod
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app_code:/var/www/html:ro          # ⬅️ อ่านโค้ดจาก volume เดียวกันแบบ read-only
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - app_net

  certbot:
    image: certbot/certbot:latest
    container_name: certbot_prod
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  app_code:
  certbot-www:
  letsencrypt:
